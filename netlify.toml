[build]
  command = "CI=false npm run build"
  publish = "build"

# CRA treats lint warnings as errors when CI=true, which fails the production
# build. Keep it false so the build matches CI.
[build.environment]
  CI = "false"

# Production never reads this file: CI deploys the bundle with the Netlify
# CLI from a job with no checkout. There, /<slug> still 301s to /<slug>/,
# which is why docsPath and the canonicals use the slashed form.
[build.processing.html]
  pretty_urls = false

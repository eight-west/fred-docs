    <title>FRED Docs</title>
    <script>
      // Set the theme before first paint so a light visit does not flash dark;
      // useSiteTheme takes over once React mounts. The key matches the one
      // biofred.us uses, but storage is per origin, so the choice is not shared.
      (function () {
        try {
          var t = localStorage.getItem('fred_landing_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          if (t === 'light') document.documentElement.setAttribute('data-landing-theme', 'light');
        } catch (e) {}
      })();
    </script>

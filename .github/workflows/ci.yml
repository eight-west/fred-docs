name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build-script tests
        run: npm run test:scripts
      - name: Component tests
        run: npm test -- --watchAll=false --maxWorkers=2

      # Warns and passes while the product repo is unreachable; fails once it
      # can see it and the tokens have diverged.
      - name: Design tokens still match the product site
        run: node scripts/check-design-drift.mjs
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production build and prerender
        run: CI=false npm run build
      - name: Every page must be prerendered
        run: |
          missing=0
          for slug in $(node -e "JSON.parse(require('fs').readFileSync('src/Platform/Docs/pages.json')).forEach(p=>console.log(p.slug))"); do
            if [ ! -f "build/$slug/index.html" ]; then echo "missing build/$slug/index.html"; missing=1; fi
          done
          test -f build/sitemap.xml || { echo "missing sitemap.xml"; missing=1; }
          exit $missing
      # netlify.toml's SPA rule is not applied to a direct CLI deploy, so the
      # catch-all has to travel with the bundle. Prerendered pages still win:
      # Netlify serves build/<slug>/index.html before falling through here.
      - name: Write redirects for direct deploys
        run: echo '/*  /index.html  200' > build/_redirects
      - name: Upload production bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: build/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download production bundle
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: build
      # Netlify's free plan refuses to build organisation-owned private repos,
      # so their git integration cannot deploy this site. Building here and
      # pushing the bundle with their CLI is the workaround they recommend.
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_NAME: ${{ vars.NETLIFY_SITE_NAME }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN must be set as a repository secret."
            exit 1
          fi
          if [ -z "$NETLIFY_SITE_NAME" ]; then
            echo "NETLIFY_SITE_NAME must be set as a repository variable."
            echo "It is not defaulted on purpose: a wrong value would publish"
            echo "these docs over another site."
            exit 1
          fi
          npx --yes netlify-cli@latest deploy \
            --prod \
            --no-build \
            --dir=build \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --site "$NETLIFY_SITE_NAME" \
            --message="main @ ${GITHUB_SHA::7}"
